<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  (function () {
    const storageKey = "site-theme";
    const button = document.getElementById("theme-toggle");
    const root = document.documentElement;

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      if (button) {
        const isNight = theme === "night";
        button.textContent = isNight ? "☾" : "☼";
        button.setAttribute("aria-label", isNight ? "Night mode" : "Light mode");
        button.setAttribute("title", isNight ? "Night mode" : "Light mode");
      }
    }

    const savedTheme = localStorage.getItem(storageKey) || "day";
    setTheme(savedTheme);

    if (button) {
      button.addEventListener("click", function () {
        const nextTheme = root.getAttribute("data-theme") === "night" ? "day" : "night";
        localStorage.setItem(storageKey, nextTheme);
        setTheme(nextTheme);
      });
    }
  })();
</script>
