<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  (function () {
    const storageKey = "site-theme";
    const button = document.getElementById("theme-toggle");
    const root = document.documentElement;

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      if (button) {
        button.textContent = theme === "night" ? "☀️ Day" : "🌙 Night";
      }

      const themeColor = document.querySelector("meta[name=\"theme-color\"]");
      if (themeColor) {
        themeColor.setAttribute("content", theme === "night" ? "#0f172a" : "#ffffff");
      }
    }

    const savedTheme = localStorage.getItem(storageKey);
    const prefersNight = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(savedTheme || (prefersNight ? "night" : "day"));

    if (button) {
      button.addEventListener("click", function () {
        const nextTheme = root.getAttribute("data-theme") === "night" ? "day" : "night";
        localStorage.setItem(storageKey, nextTheme);
        setTheme(nextTheme);
      });
    }
  })();
</script>
